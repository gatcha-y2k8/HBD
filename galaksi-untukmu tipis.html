<!DOCTYPE html>
<!-- Cara pakai singkat: cari bagian "CONFIG" di dalam <script type="module"> di bawah,
     lalu ubah judul, pesan, warna, jumlah partikel, atau tambahkan link musikmu sendiri. -->
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaksi Untukmu</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #04030a;
            --gold: #FFE8C7;
            --rose: #FF9EC4;
            --violet: #8C6BFF;
            --text: #F5EFFF;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: var(--bg);
            font-family: 'Quicksand', sans-serif;
            cursor: grab;
            -webkit-user-select: none; user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body:active { cursor: grabbing; }
        canvas { display: block; position: fixed; inset: 0; z-index: 1; }

        #main-title {
            position: absolute;
            top: clamp(20px, 5vw, 48px);
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Caveat', cursive;
            font-weight: 700;
            font-size: clamp(2.4rem, 6vw, 4.6rem);
            background: linear-gradient(120deg, var(--gold), var(--rose) 55%, var(--violet));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 22px rgba(255, 158, 196, 0.35);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            white-space: nowrap;
        }

        #entry-modal {
            position: fixed; inset: 0;
            background: var(--bg);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            gap: 18px;
            z-index: 9999;
            padding: 24px;
            text-align: center;
        }

        #entry-button {
            padding: 16px 38px;
            border: none;
            border-radius: 999px;
            background: linear-gradient(135deg, var(--rose), var(--violet));
            color: #fff;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 1.35rem;
            cursor: pointer;
            letter-spacing: 0.02em;
            filter: drop-shadow(0 0 16px rgba(255, 158, 196, 0.55)) drop-shadow(0 0 28px rgba(140, 107, 255, 0.35));
            transition: transform 0.25s ease, filter 0.25s ease;
            animation: denyut 2s ease-in-out infinite;
        }
        #entry-button:hover {
            transform: scale(1.05);
            filter: drop-shadow(0 0 22px rgba(255, 158, 196, 0.7)) drop-shadow(0 0 38px rgba(140, 107, 255, 0.5));
        }
        #entry-button:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }

        @keyframes denyut {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }

        #entry-text {
            font-family: 'Caveat', cursive;
            font-size: 1.6rem;
            color: var(--text);
            opacity: 0.85;
        }

        #love-card-overlay {
            position: fixed; inset: 0;
            background: rgba(4, 3, 10, 0.82);
            backdrop-filter: blur(6px);
            display: none;
            justify-content: center; align-items: center;
            z-index: 100;
            cursor: pointer;
            padding: 24px;
        }

        #love-card {
            width: min(92vw, 420px);
            border-radius: 26px;
            padding: 36px 28px;
            background:
                radial-gradient(circle at 30% 20%, rgba(255, 232, 199, 0.16), transparent 60%),
                linear-gradient(160deg, rgba(255, 158, 196, 0.14), rgba(140, 107, 255, 0.14));
            border: 1px solid rgba(255, 232, 199, 0.25);
            box-shadow: 0 0 40px rgba(255, 158, 196, 0.25), 0 0 70px rgba(140, 107, 255, 0.2);
            text-align: center;
            /* Ingin pakai foto sendiri sebagai latar kartu? tambahkan baris ini:
               background-image: url('foto-kamu.jpg'); background-size: cover; background-position: center; */
        }

        #love-card-text {
            font-family: 'Caveat', cursive;
            font-size: 1.9rem;
            line-height: 1.4;
            color: var(--text);
        }

        @media (max-width: 768px) {
            #main-title { top: 20px; white-space: normal; padding: 0 12px; }
            #love-card-text { font-size: 1.6rem; }
            #entry-button { font-size: 1.15rem; padding: 14px 30px; }
        }
    </style>
</head>
<body>
    <h1 id="main-title"></h1>

    <div id="entry-modal">
        <button id="entry-button" type="button"></button>
        <div id="entry-text"></div>
    </div>

    <div id="love-card-overlay">
        <div id="love-card">
            <p id="love-card-text"></p>
        </div>
    </div>

    <audio id="background-music" loop></audio>

    <canvas id="galaxy-canvas"></canvas>

    <script type="importmap">
    { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
    </script>

    <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    // ===================================================================
    // ===================  MODUL PENGATURAN — EDIT DI SINI  =============
    // ===================================================================
    const CONFIG = {
        judul: 'Happy Birth Day',
        teksTombolMasuk: 'Sentuh di sini',
        teksMasuk: 'Ketuk untuk memulai perjalanan',
        musikUrl: 'ultah.mp3', // isi dengan URL musikmu sendiri jika ingin ada lagu latar, kosongkan jika tidak

        galaxy: { rotationSpeed: 0.1 },
        jarakBebasElemen: 38,

        lubangHitam: { radius: 11, warna1: '#0B0014', warna2: '#1A0033' },

        cincinAkresi: {
            innerRadius: 16, outerRadius: 30, segments: 128,
            warnaPusat: '#FFE8C7',
            warnaTengah: '#FF9EC4',
            warnaTepi: '#8C6BFF',
            emissiveIntensity: 0.65
        },

        partikel: {
            // Awan bintang utama di dekat lubang hitam — nuansa emas hangat
            bintangInti: {
                count: 18000, radius: 115, maxHeight: 55, size: 0.25,
                hueMin: 0.02, hueMax: 0.08
            },
            // Selubung bola di luar — nuansa ungu-biru, memberi kedalaman
            haloBola: {
                count: 16000, radiusXZ: 105, radiusY: 50, size: 0.18,
                minJarakPusat: 26,
                hueMin: 0.68, hueMax: 0.78
            },
            bintangLatar: { count: 4500, radius: 480, size: 0.2 },

            teks: {
                count: 40, width: 42, height: 18, maxRadius: 115,
                isi: [
                    'A Million Magic Whishes To You',
                    'All The Best On Your Special Day!',
                    'Many Happy Return Of he Day',
                    'I Hope You Alwys Happy and Fine',
                    'Wish You All The Best',
                    'Alwys Be Happy',
                    'Whishing You A Birthday Filled With Love, Fun, And Surprises',
                    'Another Trip Around The Sun',
                    'Wishing You A Bautiful Year Ahead',
                    'Have A Great One'
                ],
                warna: [
                    { fill: '#FFD9C2', shadow: '#FF9EC4' },
                    { fill: '#E8D9FF', shadow: '#8C6BFF' },
                    { fill: '#FFE8C7', shadow: '#FF7EB3' }
                ]
            },
            emoji: {
                count: 45, size: 11, maxRadius: 115,
                isi: ['💫', '✨', '🌙', '💖', '🌸', '⭐'],
                warna: [
                    { fill: '#FFE8C7', shadow: '#FF9EC4' },
                    { fill: '#E8D9FF', shadow: '#8C6BFF' }
                ]
            }
        },

        kartuCinta: {
            pesan: [
                'Pergi Ke Pasar Membeli Bihun, Pulangnya Bareng Pak Adul. Selamat Ulang Tahun, Semoga Sehat Selalu.',
                'Beli Balon Ke Pasar Minggu, Pulangnya Ketemu Kamu.',
                'Happy Birthday To You, Semoga Sehat Selalu.',
                'Apa lagi yh'
            ]
        },

        bintangJatuh: { enabled: true, spawnProbability: 0.012, speed: 1.1 },
        pencahayaan: {
            ambient: { warna: '#ffffff', intensity: 0.12 },
            titik: { warna: '#FF9EC4', intensity: 2.2, distance: 340 }
        },
        bloom: { threshold: 0.65, strength: 0.75, radius: 0.55 },
        kontrolKamera: { minDistance: 28, maxDistance: 260 }
    };
    // ===================================================================

    // Terapkan teks dari CONFIG ke elemen HTML
    document.title = CONFIG.judul;
    document.getElementById('main-title').textContent = CONFIG.judul;
    document.getElementById('entry-button').textContent = CONFIG.teksTombolMasuk;
    document.getElementById('entry-text').textContent = CONFIG.teksMasuk;

    const kurangiGerak = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    let scene, camera, renderer, controls, composer, clock, raycaster, mouse;
    let grupGalaksi, materialInti;
    let daftarTeksCinta = [], daftarEmojiCinta = [], daftarBintangJatuh = [];
    let posisiTerpakai = [];
    let indeksKartuSaatIni = 0;

    const vertexIntiShader = `
        varying vec2 vUv;
        void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
    `;
    const fragmentIntiShader = `
        uniform float uTime;
        uniform vec3 uColorA;
        uniform vec3 uColorB;
        varying vec2 vUv;

        float acak(vec2 st) {
            return fract(sin(dot(st.xy, vec2(12.9898, 78.233))) * 43758.5453123);
        }
        float noise(vec2 st) {
            vec2 i = floor(st);
            vec2 f = fract(st);
            float a = acak(i);
            float b = acak(i + vec2(1.0, 0.0));
            float c = acak(i + vec2(0.0, 1.0));
            float d = acak(i + vec2(1.0, 1.0));
            vec2 u = f * f * (3.0 - 2.0 * f);
            return mix(a, b, u.x) + (c - a) * u.y * (1.0 - u.x) + (d - b) * u.x * u.y;
        }
        void main() {
            float n = noise(vUv * 6.0 + uTime * 0.08);
            vec3 warna = mix(uColorA, uColorB, n);
            gl_FragColor = vec4(warna, 1.0);
        }
    `;
    const vertexCincinShader = `
        varying vec3 vPos;
        void main() {
            vPos = position;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
    `;
    const fragmentCincinShader = `
        uniform float innerR;
        uniform float outerR;
        uniform vec3 warnaPusat;
        uniform vec3 warnaTengah;
        uniform vec3 warnaTepi;
        uniform float emisiIntensity;
        varying vec3 vPos;

        void main() {
            float jarak = length(vPos.xy);
            float t = clamp((jarak - innerR) / (outerR - innerR), 0.0, 1.0);
            vec3 warna;
            if (t < 0.5) {
                warna = mix(warnaPusat, warnaTengah, t * 2.0);
            } else {
                warna = mix(warnaTengah, warnaTepi, (t - 0.5) * 2.0);
            }
            float glow = 1.0 - smoothstep(0.0, 1.0, t);
            vec3 emisi = warna * emisiIntensity * glow;
            gl_FragColor = vec4(warna + emisi, 1.0);
        }
    `;

    function init() {
        scene = new THREE.Scene();
        clock = new THREE.Clock();
        raycaster = new THREE.Raycaster();
        mouse = new THREE.Vector2();

        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('galaxy-canvas'), antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);

        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = CONFIG.kontrolKamera.minDistance;
        controls.maxDistance = CONFIG.kontrolKamera.maxDistance;

        const renderPass = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.4, 0.4, 0.85);
        bloomPass.threshold = CONFIG.bloom.threshold;
        bloomPass.strength = CONFIG.bloom.strength;
        bloomPass.radius = CONFIG.bloom.radius;
        composer = new EffectComposer(renderer);
        composer.addPass(renderPass);
        composer.addPass(bloomPass);

        const { ambient, titik } = CONFIG.pencahayaan;
        scene.add(new THREE.AmbientLight(ambient.warna, ambient.intensity));
        const lampuUtama = new THREE.PointLight(titik.warna, titik.intensity, titik.distance);
        lampuUtama.position.set(0, 0, 0);
        scene.add(lampuUtama);

        grupGalaksi = new THREE.Group();
        scene.add(grupGalaksi);

        buatLubangHitam();
        buatBintangInti();
        buatHaloBola();
        buatBintangLatar();
        buatElemenCinta();

        if (kurangiGerak) {
            CONFIG.galaxy.rotationSpeed *= 0.35;
            CONFIG.bintangJatuh.spawnProbability *= 0.3;
        }

        window.addEventListener('resize', saatUkuranBerubah);
        renderer.domElement.addEventListener('click', saatKanvasDiklik);
        saatUkuranBerubah();
        animasi();
    }

    function buatLubangHitam() {
        const bh = CONFIG.lubangHitam;
        const cincin = CONFIG.cincinAkresi;

        materialInti = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uColorA: { value: new THREE.Color(bh.warna1) },
                uColorB: { value: new THREE.Color(bh.warna2) }
            },
            vertexShader: vertexIntiShader,
            fragmentShader: fragmentIntiShader
        });
        scene.add(new THREE.Mesh(new THREE.SphereGeometry(bh.radius, 64, 64), materialInti));

        const ringGeo = new THREE.RingGeometry(cincin.innerRadius, cincin.outerRadius, cincin.segments);
        const ringMat = new THREE.ShaderMaterial({
            uniforms: {
                innerR: { value: cincin.innerRadius },
                outerR: { value: cincin.outerRadius },
                warnaPusat: { value: new THREE.Color(cincin.warnaPusat) },
                warnaTengah: { value: new THREE.Color(cincin.warnaTengah) },
                warnaTepi: { value: new THREE.Color(cincin.warnaTepi) },
                emisiIntensity: { value: cincin.emissiveIntensity }
            },
            vertexShader: vertexCincinShader,
            fragmentShader: fragmentCincinShader,
            side: THREE.DoubleSide
        });
        const cincinEmas = new THREE.Mesh(ringGeo, ringMat);
        cincinEmas.rotation.x = Math.PI / 2;
        scene.add(cincinEmas);
    }

    function buatBintangInti() {
        const cfg = CONFIG.partikel.bintangInti;
        const geometry = new THREE.BufferGeometry();
        const posisi = new Float32Array(cfg.count * 3);
        const warna = new Float32Array(cfg.count * 3);
        const c = new THREE.Color();
        const batasDalam = CONFIG.cincinAkresi.outerRadius;

        for (let i = 0; i < cfg.count; i++) {
            const jarak = batasDalam + Math.random() * (cfg.radius - batasDalam);
            const sudut = Math.random() * Math.PI * 2;
            const y = (Math.random() - 0.5) * cfg.maxHeight * Math.pow(1 - (jarak / cfg.radius), 1.5);
            posisi.set([Math.cos(sudut) * jarak, y, Math.sin(sudut) * jarak], i * 3);

            const hue = cfg.hueMin + Math.random() * (cfg.hueMax - cfg.hueMin);
            const sat = 0.75 + Math.random() * 0.25;
            const light = 0.6 + Math.random() * 0.35;
            c.setHSL(hue, sat, light);
            warna.set([c.r, c.g, c.b], i * 3);
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(posisi, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(warna, 3));
        const material = new THREE.PointsMaterial({ size: cfg.size, blending: THREE.AdditiveBlending, vertexColors: true, transparent: true });
        grupGalaksi.add(new THREE.Points(geometry, material));
    }

    function buatHaloBola() {
        const cfg = CONFIG.partikel.haloBola;
        const geometry = new THREE.BufferGeometry();
        const posisi = new Float32Array(cfg.count * 3);
        const warna = new Float32Array(cfg.count * 3);
        const c = new THREE.Color();

        let terisi = 0;
        let percobaan = 0;
        const maxPercobaan = cfg.count * 40;
        while (terisi < cfg.count && percobaan < maxPercobaan) {
            percobaan++;
            const rx = Math.random() * 2 - 1;
            const ry = Math.random() * 2 - 1;
            const rz = Math.random() * 2 - 1;
            if (rx * rx + ry * ry + rz * rz > 1.0) continue;

            const x = rx * cfg.radiusXZ;
            const y = ry * cfg.radiusY;
            const z = rz * cfg.radiusXZ;
            const jarakPusat = Math.sqrt(x * x + y * y + z * z);
            if (jarakPusat < cfg.minJarakPusat) continue;

            const rNorm = jarakPusat / Math.max(cfg.radiusXZ, cfg.radiusY);
            if (Math.random() > Math.pow(1.0 - rNorm * 0.7, 1.2)) continue;

            posisi.set([x, y, z], terisi * 3);
            const hue = cfg.hueMin + Math.random() * (cfg.hueMax - cfg.hueMin);
            const sat = 0.55 + Math.random() * 0.4;
            const light = 0.45 + Math.random() * 0.4;
            c.setHSL(hue, sat, light);
            warna.set([c.r, c.g, c.b], terisi * 3);
            terisi++;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(posisi, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(warna, 3));
        const material = new THREE.PointsMaterial({ size: cfg.size, blending: THREE.AdditiveBlending, vertexColors: true, transparent: true, opacity: 0.65 });
        grupGalaksi.add(new THREE.Points(geometry, material));
    }

    function buatBintangLatar() {
        const cfg = CONFIG.partikel.bintangLatar;
        const geometry = new THREE.BufferGeometry();
        const posisi = new Float32Array(cfg.count * 3);
        for (let i = 0; i < cfg.count; i++) {
            const r = cfg.radius;
            posisi.set([(Math.random() - 0.5) * 2 * r, (Math.random() - 0.5) * 2 * r, (Math.random() - 0.5) * 2 * r], i * 3);
        }
        geometry.setAttribute('position', new THREE.BufferAttribute(posisi, 3));
        const material = new THREE.PointsMaterial({ size: cfg.size, color: 0xffffff, transparent: true, opacity: 0.5 });
        scene.add(new THREE.Points(geometry, material));
    }

    function buatBintangJatuh() {
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array([0, 0, 0]), 3));
        const material = new THREE.PointsMaterial({ color: 0xffffff, size: 1.8, blending: THREE.AdditiveBlending, transparent: true });
        const bintang = new THREE.Points(geometry, material);

        const x = THREE.MathUtils.randFloatSpread(800);
        const y = THREE.MathUtils.randFloat(100, 300);
        const z = THREE.MathUtils.randFloatSpread(800);
        bintang.position.set(x, y, z);

        bintang.userData.kecepatan = new THREE.Vector3(
            (Math.random() < 0.5 ? -1 : 1) * CONFIG.bintangJatuh.speed,
            -CONFIG.bintangJatuh.speed * 0.5,
            (Math.random() - 0.5) * 2
        );
        bintang.userData.umur = 0;

        daftarBintangJatuh.push(bintang);
        scene.add(bintang);
    }

    function setPosisiOrbit(elemen, maxRadius) {
        const minRadius = CONFIG.jarakBebasElemen;
        const pisahMin = 16;
        const maxPercobaan = 50;
        let posisiValid = false;
        let percobaan = 0;
        let hasil = { x: 0, y: 0, z: 0 };

        while (!posisiValid && percobaan < maxPercobaan) {
            percobaan++;
            const radius = minRadius + Math.random() * (maxRadius - minRadius);
            const theta = Math.random() * Math.PI * 2;
            const y = (Math.random() - 0.5) * 15;
            const x = radius * Math.cos(theta);
            const z = radius * Math.sin(theta);
            posisiValid = true;
            for (const pos of posisiTerpakai) {
                const jarak = Math.sqrt((x - pos.x) ** 2 + (y - pos.y) ** 2 + (z - pos.z) ** 2);
                if (jarak < pisahMin) { posisiValid = false; break; }
            }
            if (posisiValid) hasil = { x, y, z };
        }
        elemen.position.set(hasil.x, hasil.y, hasil.z);
        posisiTerpakai.push(hasil);
    }

    function buatElemenCinta() {
        const teksCfg = CONFIG.partikel.teks;
        const emojiCfg = CONFIG.partikel.emoji;

        for (let i = 0; i < teksCfg.count; i++) {
            const warnaData = teksCfg.warna[i % teksCfg.warna.length];
            const texture = buatTeksturTeks(teksCfg.isi[i % teksCfg.isi.length], warnaData);
            const material = new THREE.MeshPhongMaterial({ map: texture, transparent: true, alphaTest: 0.1, emissive: warnaData.fill, emissiveIntensity: 1.1 });
            const mesh = new THREE.Mesh(new THREE.PlaneGeometry(teksCfg.width, teksCfg.height), material);
            setPosisiOrbit(mesh, teksCfg.maxRadius);
            grupGalaksi.add(mesh);
            daftarTeksCinta.push(mesh);
        }

        for (let i = 0; i < emojiCfg.count; i++) {
            const warnaData = emojiCfg.warna[i % emojiCfg.warna.length];
            const emoji = emojiCfg.isi[i % emojiCfg.isi.length];
            const texture = buatTeksturEmoji(emoji, warnaData);
            const material = new THREE.MeshBasicMaterial({ map: texture, transparent: true, alphaTest: 0.1 });
            const mesh = new THREE.Mesh(new THREE.PlaneGeometry(emojiCfg.size, emojiCfg.size), material);
            setPosisiOrbit(mesh, emojiCfg.maxRadius);
            grupGalaksi.add(mesh);
            daftarEmojiCinta.push(mesh);
        }
    }

    function buatTeksturTeks(teks, warnaData) {
        const canvas = document.createElement('canvas');
        canvas.width = 1536; canvas.height = 512;
        const ctx = canvas.getContext('2d');
        ctx.font = '86px "Caveat", cursive';
        ctx.fillStyle = warnaData.fill;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = warnaData.shadow;
        ctx.shadowBlur = 6;

        const kata = teks.split(' ');
        let baris = [];
        let barisSaatIni = kata[0];
        const lebarMax = canvas.width - 100;
        const tinggiBaris = 100;

        for (let i = 1; i < kata.length; i++) {
            const tes = barisSaatIni + ' ' + kata[i];
            if (ctx.measureText(tes).width > lebarMax && barisSaatIni.length > 0) {
                baris.push(barisSaatIni);
                barisSaatIni = kata[i];
            } else {
                barisSaatIni = tes;
            }
        }
        baris.push(barisSaatIni);

        const mulaiY = canvas.height / 2 - (baris.length - 1) * tinggiBaris / 2;
        baris.forEach((b, idx) => ctx.fillText(b, canvas.width / 2, mulaiY + idx * tinggiBaris));

        return new THREE.CanvasTexture(canvas);
    }

    function buatTeksturEmoji(emoji, warnaData) {
        const canvas = document.createElement('canvas');
        canvas.width = 512; canvas.height = 512;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = '300px "Segoe UI Emoji", "Apple Color Emoji", sans-serif';
        ctx.shadowColor = warnaData.shadow;
        ctx.shadowBlur = 22;
        ctx.fillStyle = warnaData.fill;
        ctx.fillText(emoji, canvas.width / 2, canvas.height / 2 + 14);

        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.generateMipmaps = false;
        texture.minFilter = THREE.LinearFilter;
        texture.magFilter = THREE.LinearFilter;
        return texture;
    }

    function saatUkuranBerubah() {
        const width = window.innerWidth;
        const height = window.innerHeight;
        renderer.setSize(width, height);
        composer.setSize(width, height);
        camera.aspect = width / height;
        camera.position.set(0, 32, width < 768 ? 145 : 115);
        camera.updateProjectionMatrix();
    }

    function saatKanvasDiklik(event) {
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const target = daftarTeksCinta.concat(daftarEmojiCinta);
        const intersects = raycaster.intersectObjects(target);
        if (intersects.length > 0) {
            tampilkanKartuCinta();
        }
    }

    function tampilkanKartuCinta() {
        const overlay = document.getElementById('love-card-overlay');
        const teks = document.getElementById('love-card-text');
        const pesan = CONFIG.kartuCinta.pesan;
        teks.textContent = pesan[indeksKartuSaatIni];
        overlay.style.display = 'flex';
        indeksKartuSaatIni = (indeksKartuSaatIni + 1) % pesan.length;
    }

    function sembunyikanKartuCinta() {
        document.getElementById('love-card-overlay').style.display = 'none';
    }

    function animasi() {
        requestAnimationFrame(animasi);
        const waktu = clock.getElapsedTime();
        grupGalaksi.rotation.y = waktu * CONFIG.galaxy.rotationSpeed;
        if (materialInti) materialInti.uniforms.uTime.value = waktu;

        daftarTeksCinta.forEach(t => t.lookAt(camera.position));
        daftarEmojiCinta.forEach(e => e.lookAt(camera.position));

        if (CONFIG.bintangJatuh.enabled && Math.random() < CONFIG.bintangJatuh.spawnProbability) {
            buatBintangJatuh();
        }

        for (let i = daftarBintangJatuh.length - 1; i >= 0; i--) {
            const b = daftarBintangJatuh[i];
            b.position.add(b.userData.kecepatan);
            b.userData.umur++;
            if (b.userData.umur > 300) {
                scene.remove(b);
                daftarBintangJatuh.splice(i, 1);
            }
        }

        controls.update();
        composer.render();
    }

    init();

    document.getElementById('entry-button').addEventListener('click', () => {
        document.getElementById('entry-modal').style.display = 'none';
        if (CONFIG.musikUrl) {
            const musik = document.getElementById('background-music');
            musik.src = CONFIG.musikUrl;
            musik.play().catch(() => {});
        }
    });

    document.getElementById('love-card-overlay').addEventListener('click', sembunyikanKartuCinta);
    </script>
</body>
</html>
